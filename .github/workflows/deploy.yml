name: Deploy Payment Gateway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.5    # ← CHANGE THIS
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/payment-gateway
            git fetch origin main && git reset --hard origin/main
            docker build -t payment-gateway:latest .
            docker stop payment-gateway || true
            docker rm payment-gateway || true
            docker run -d \
              --name payment-gateway \
              --restart unless-stopped \
              -p 127.0.0.1:8081:8080 \
              -v ~/payment-gateway/config/application-prod.properties:/app/config/application-prod.properties \
              payment-gateway:latest
